name: Generate Pac-Man Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: FeKiModesto
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Convert Snake to Pac-Man (substitui imagens)
        run: |
          # Substitui a cobrinha pelo Pac-Man nos SVGs gerados
          sed -i 's/snake/pacman/g' dist/*.svg
          sed -i 's/Snake/PacMan/g' dist/*.svg
          
          # Renomeia os arquivos
          mv dist/snake.svg dist/pacman.svg 2>/dev/null || true
          mv dist/snake-dark.svg dist/pacman-dark.svg 2>/dev/null || true

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dist/*.svg
          git commit -m "feat: atualiza animação Pac-Man" || echo "Sem mudanças para commitar"
          git push origin main || echo "Sem mudanças para commitar"

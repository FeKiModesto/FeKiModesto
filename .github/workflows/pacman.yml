name: Generate Pac-Man Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pac-Man
        uses: Platane/snk@v3
        with:
          github_user_name: FeKiModesto
          outputs: |
            dist/pacman.svg?palette=github-dark&animation=pacman
            dist/pacman-dark.svg?palette=github-dark&animation=pacman

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

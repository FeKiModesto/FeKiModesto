name: Update Recent Repositories

on:
  schedule:
    - cron: "0 */6 * * *"  # roda a cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest repos and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const username = "FeKiModesto";

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username,
                sort: "updated",
                per_page: 5
              }
            );

            const filtered = repos
              .filter(r => !r.fork)
              .slice(0, 5);

            const markdown = filtered.map(repo => {
              return `- 🔹 [${repo.name}](${repo.html_url}) — ${repo.description || "Sem descrição"}`;
            }).join('\n');

            const readme = fs.readFileSync('README.md', 'utf8');

            const newReadme = readme.replace(
              /<!-- START_REPOS -->([\s\S]*?)<!-- END_REPOS -->/,
              `<!-- START_REPOS -->\n${markdown}\n<!-- END_REPOS -->`
            );

            fs.writeFileSync('README.md', newReadme);

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update recent repos" || exit 0
          git push
